# DESIGN VALUES, NOT READ BY THE CODE YET.
# Today the live settings come from .env and constants in core/*.py.
# This file records the target configuration from TESTIMONY_ORDER.md §6;
# wiring it in is on the roadmap (see PLAN.md).

testimony:
  mode: parallel
  quorum: 2
  soft_deadline_s: 20
  timeout_s: {default: 30, local: 120, ollama_cloud: 120}
  retries: 2

exhibits:
  shuffle: true
  log_seed: true
  double_check: false   # --double-check flag turns it on

tiers:
  1: [local, groq, gemini]
  2: [ollama_cloud, mistral]
  3: [openrouter]

judge:
  default: claude-haiku-5-5
  escalate_to: claude-opus-5-5
  escalate_when: {split: true, confidence_below: 0.5}
